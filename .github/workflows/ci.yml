name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: |
          python -m py_compile \
            skills/aihub-access/scripts/aihub.py \
            scripts/install_skill.py \
            tests/test_aihub.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate OpenAPI 3.1 specification
        run: |
          python -m pip install --disable-pip-version-check openapi-spec-validator
          openapi-spec-validator openapi/aihub.openapi.yaml
      - name: Check downloader CLI
        run: python skills/aihub-access/scripts/aihub.py --help
