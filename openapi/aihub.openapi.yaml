openapi: 3.1.0
info:
  title: AI Hub Open API
  version: "0.6-observed"
  summary: aihubshell v0.6에서 확인한 AI Hub HTTP API
  description: |
    이 명세는 제공된 aihubshell v0.6 소스와 AI Hub 공식 Shell 안내에서
    확인한 HTTP 경로를 정리한 커뮤니티 명세다. AI Hub의 공식 명세가 아니다.

    메타데이터 응답의 전체 JSON Schema와 오류 응답 구조는 공개 자료에서
    확인하지 못해 임의로 정의하지 않았다. 승인 상태 조회 API도 확인한
    Shell 자료에서는 찾지 못했으며, 다른 미문서화 API가 없다고 단정하지 않는다.
  contact:
    name: AIHub4All 커뮤니티
    url: https://github.com/acidsound/aihub4all
  license:
    name: MIT
    url: https://opensource.org/license/mit
externalDocs:
  description: AI Hub 공식 API Shell 사용 안내
  url: https://aihub.or.kr/devsport/apishell/list.do?currMenu=528&topMenu=100
servers:
  - url: https://api.aihub.or.kr
    description: AI Hub API 서버
tags:
  - name: 데이터셋
    description: 데이터셋 목록과 파일 정보 조회
  - name: 데이터 패키지
    description: 데이터 패키지 목록과 파일 정보 조회
  - name: 다운로드
    description: 데이터셋 및 데이터 패키지 파일 다운로드
paths:
  /info/dataset.do:
    get:
      tags: [데이터셋]
      operationId: listDatasets
      summary: 데이터셋 목록 조회
      description: AI Hub에서 제공하는 데이터셋 목록을 조회한다. aihubshell은 이 요청에 API 키를 넣지 않는다.
      responses:
        "200":
          description: 데이터셋 목록. 전체 JSON 구조는 아직 확인하지 않았다.
          content:
            application/json:
              schema: {}
        default:
          $ref: "#/components/responses/UnverifiedError"
  /info/{datasetKey}.do:
    get:
      tags: [데이터셋]
      operationId: getDatasetFileTree
      summary: 데이터셋 상세 및 파일 목록 조회
      description: 데이터셋의 상세 정보와 파일 트리를 조회한다. 공식 안내는 파일명, 용량, 파일 식별자 등의 정보를 설명하지만 전체 JSON Schema는 공개하지 않는다.
      parameters:
        - $ref: "#/components/parameters/DatasetKey"
      responses:
        "200":
          description: 데이터셋 상세 및 파일 트리. 전체 JSON 구조는 아직 확인하지 않았다.
          content:
            application/json:
              schema: {}
        default:
          $ref: "#/components/responses/UnverifiedError"
  /info/datapckage.do:
    get:
      tags: [데이터 패키지]
      operationId: listDataPackages
      summary: 데이터 패키지 목록 조회
      description: 서버에서 사용하는 datapckage 경로 표기를 그대로 유지한다. aihubshell은 이 요청에 API 키를 넣지 않는다.
      responses:
        "200":
          description: 데이터 패키지 목록. 전체 JSON 구조는 아직 확인하지 않았다.
          content:
            application/json:
              schema: {}
        default:
          $ref: "#/components/responses/UnverifiedError"
  /info/pckage/{packageKey}.do:
    get:
      tags: [데이터 패키지]
      operationId: getDataPackageFileTree
      summary: 데이터 패키지 상세 및 파일 목록 조회
      description: 서버에서 사용하는 pckage 경로 표기를 그대로 유지한다.
      parameters:
        - $ref: "#/components/parameters/PackageKey"
      responses:
        "200":
          description: 데이터 패키지 상세 및 파일 트리. 전체 JSON 구조는 아직 확인하지 않았다.
          content:
            application/json:
              schema: {}
        default:
          $ref: "#/components/responses/UnverifiedError"
  /down/0.6/{datasetKey}.do:
    get:
      tags: [다운로드]
      operationId: downloadDataset
      summary: 데이터셋 파일 다운로드
      description: |
        API 키가 필요하다. AI Hub의 데이터별 이용 신청 절차가 필요한 경우는
        웹사이트에서 진행한다. 이 요청으로 신청·승인 상태를 조회하지 않는다.
        사용자 도구에서 파일 ID를 생략하면 fileSn=all을 사용한다.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/DatasetKey"
        - $ref: "#/components/parameters/FileSelection"
      responses:
        "200":
          description: TAR 아카이브. 실제 응답 헤더는 별도 검증이 필요하다.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/UnverifiedError"
  /down/pckage/0.6/{packageKey}.do:
    get:
      tags: [다운로드]
      operationId: downloadDataPackage
      summary: 데이터 패키지 파일 다운로드
      description: |
        API 키가 필요하다. AI Hub의 데이터별 이용 신청 절차가 필요한 경우는
        웹사이트에서 진행한다. 이 요청으로 신청·승인 상태를 조회하지 않는다.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageKey"
        - $ref: "#/components/parameters/FileSelection"
      responses:
        "200":
          description: TAR 아카이브. 실제 응답 헤더는 별도 검증이 필요하다.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/UnverifiedError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: AI Hub에서 발급받은 API 키. 외부에 노출하지 않는다.
  parameters:
    DatasetKey:
      name: datasetKey
      in: path
      required: true
      description: AI Hub 데이터셋 식별자
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "593"
    PackageKey:
      name: packageKey
      in: path
      required: true
      description: AI Hub 데이터 패키지 식별자. 서버 경로는 pckage 표기를 사용한다.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1"
    FileSelection:
      name: fileSn
      in: query
      required: false
      description: 쉼표로 구분한 파일 ID. 전체 파일은 all을 사용한다.
      allowReserved: true
      schema:
        type: string
        default: all
        pattern: "^(all|[0-9]+(,[0-9]+)*)$"
      examples:
        all:
          summary: 전체 파일
          value: all
        selected:
          summary: 지정한 파일
          value: "51937,51938"
  responses:
    UnverifiedError:
      description: 오류 응답. 상태 코드별 본문 구조는 실응답 검증이 필요하다.
      content:
        application/json:
          schema: {}
